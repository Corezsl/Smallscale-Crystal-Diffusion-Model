[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallscale-crystal-diffusion"
version = "0.1.0"
description = "Continuous diffusion models for periodic crystal structures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "pymatgen>=2023.5.10",
    "ase>=3.22.1",
    "mp-api>=0.33.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
smallscale-crystal-download = "crystal_diffusion.cli:download_cli"
smallscale-crystal-train = "crystal_diffusion.cli:train_cli"
smallscale-crystal-generate = "crystal_diffusion.cli:generate_cli"
smallscale-crystal-evaluate = "crystal_diffusion.cli:evaluate_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401"]
